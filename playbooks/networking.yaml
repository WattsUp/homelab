---
- name: Configure managed switches
  hosts: leela
  connection: local
  gather_facts: false
  roles:
    - role: qnap_qsw_m2116p_2t2s
- name: Setup interfaces with netplan
  hosts: eth_netplan
  roles:
    - role: netplan_vlan
      netplan_vlan_vlans: "{{ vlans }}"
      netplan_vlan_mac: "{{ eth_services_mac }}"
      netplan_vlan_extra_eths: "{{ vlans_extras | default({}) }}"
      netplan_vlan_dns_addresses:
        - "{{ ip_dns_0 }}"
        - "{{ ip_dns_1 }}"
      netplan_vlan_domain: "{{ domain_lan }}"
      netplan_vlan_hw_offload: "{{ vlan_hw_offload | default(true) }}"
- name: Setup interfaces with ifupdown
  hosts: eth_ifupdown
  roles:
    - role: ifupdown
      become: true
      ifupdown_interfaces:
        - interface: lo
          type: loopback
          mode: loopback
        - interface: eth-mgmt
          type: interface
          mode: manual
        - interface: vmbr0
          type: bridge
          mode: static
          ip: "{{ ip_management }}"
          mask: 24
          gateway: "{{ vlan_management.ip }}.1"
          bridge_port: eth-mgmt
        - interface: eth-bridge
          type: interface
          mode: manual
        - interface: vmbr1
          type: bridge
          mode: manual
          bridge_port: eth-bridge
      ifupdown_dns_addresses:
        - "{{ ip_dns_0 }}"
        - "{{ ip_dns_1 }}"
      ifupdown_domain: "{{ domain_lan }}"
