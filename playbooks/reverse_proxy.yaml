---
- name: Install reverse proxy
  hosts: docker0.nibbler
  roles:
    - role: reverse_proxy
      become: true
      reverse_proxy_network: "{{ docker_services_network }}"
      reverse_proxy_ip: "{{ ip_reverse_proxy }}"
      reverse_proxy_extra_networks:
        - name: "{{ docker_uptime_network }}"
          # NOTE: These aliases keep Kuma's HTTPS hostname and SNI intact while
          # sending GUI checks directly over the private Docker bridge.
          aliases:
            - "dns0.{{ domain_lan }}"
            - "dns1.{{ domain_lan }}"
            - "morbo.{{ domain_lan }}"
            - "linda.{{ domain_lan }}"
            - "prometheus.{{ domain_lan }}"
            - "grafana.{{ domain_lan }}"
            - "nummus.{{ domain_lan }}"
            - "home.{{ domain_lan }}"
        - name: "{{ 'vlan-' + vlan_networking.name }}"
          ipv4_address: "{{ ip_reverse_proxy_dns }}"
        - name: "{{ 'vlan-' + vlan_automation.name }}"
          ipv4_address: "{{ ip_reverse_proxy_automation }}"
      reverse_proxy_exporter_network: "{{ docker_services_network }}"
      reverse_proxy_wildcard: "{{ domain_lan }}"
      reverse_proxy_conf: private
      reverse_proxy_services:
        - name: dns
          ip: "{{ ip_dns_0 }}"
          suffix: "/admin"
          server_extra: rewrite ^/admin/?(.*)$ /$1 permanent;
        - name: dns0
          ip: "{{ ip_dns_0 }}"
          suffix: "/admin"
          server_extra: rewrite ^/admin/?(.*)$ /$1 permanent;
        - name: dns1
          ip: "{{ ip_dns_1 }}"
          suffix: "/admin"
          server_extra: rewrite ^/admin/?(.*)$ /$1 permanent;
        # morbo is WAP and requires special headers to talk through proxy
        - name: morbo
          ip: "{{ hostvars['morbo'].ip_management }}"
          scheme: https
          port: 443
          header_host: "{{ hostvars['morbo'].ip_management }}"
        # linda is WAP and requires special headers to talk through proxy
        - name: linda
          ip: "{{ hostvars['linda'].ip_management }}"
          scheme: https
          port: 443
          header_host: "{{ hostvars['linda'].ip_management }}"
        - name: nibbler
          ip: "{{ hostvars['nibbler'].ip_management }}"
          scheme: https
          port: 443
        - name: leela
          ip: "{{ hostvars['leela'].ip_management }}"
          scheme: https
          port: 443
        - name: sal
          ip: "{{ hostvars['sal'].ip_management }}"
          scheme: https
          port: 443
        - name: uptime
          host: uptime-kuma
          port: 3001
        - name: prometheus
          host: prometheus
          port: 9090
        - name: alertmanager
          host: alertmanager
          port: 9093
        - name: grafana
          host: grafana
          port: 3000
        - name: dns0-exporter
          ip: "{{ ip_dns_exporter_0 }}"
          port: 9617
        - name: ntp-exporter
          host: ntp-exporter
          port: 9123
        - name: nginx-exporter
          host: nginx-exporter
          port: 4040
        - name: pve-exporter
          host: pve-exporter
          port: 9221
        - name: beehive
          ip: "{{ ip_beehive }}"
        - name: nummus
          host: nummus
          port: 8000
        - name: home
          ip: "{{ ip_home_assistant }}"
          port: 8123
          # Home Assistant has no trusted-proxy entry for this proxy address.
          # Keep the service reachable without trusting arbitrary client IPs.
          forwarded_headers: false
- name: Install nginx exporter
  hosts: docker0.nibbler
  roles:
    - role: nginx_exporter
      become: true
      nginx_exporter_network: "{{ docker_services_network }}"
