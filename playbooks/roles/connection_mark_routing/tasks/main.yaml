---
- name: Install connection-mark routing script
  become: true
  ansible.builtin.template:
    src: connection-mark-routing.sh.j2
    dest: /usr/local/sbin/connection-mark-routing
    owner: root
    group: root
    mode: "0755"
  notify: Restart connection-mark routing
- name: Install connection-mark routing service
  become: true
  ansible.builtin.template:
    src: connection-mark-routing.service.j2
    dest: /etc/systemd/system/connection-mark-routing.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart connection-mark routing
- name: Enable connection-mark routing service
  become: true
  ansible.builtin.systemd_service:
    name: connection-mark-routing.service
    enabled: true
    daemon_reload: true
