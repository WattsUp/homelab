---
- name: Make directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/node_exporter
    - /etc/node_exporter/scrapers
    - /etc/node_exporter/wrappers
    - /var/lib/node_exporter
- name: Install tools
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  when: node_exporter_baremetal
  loop:
    - smartmontools
    - moreutils
- name: Copy textfile exporters
  ansible.posix.synchronize:
    dest: /etc/node_exporter/scrapers
    src: files/
    owner: false
    group: false
  when: node_exporter_baremetal
- name: Find scraper scripts on the managed host
  ansible.builtin.find:
    paths: /etc/node_exporter/scrapers
    patterns: "*.sh"
    file_type: file
  register: node_exporter_scraper_files
  when: node_exporter_baremetal
- name: Create scraper wrapper
  ansible.builtin.template:
    dest: "{{ path }}/{{ item.path | basename }}"
    src: scraper-wrapper-sh.jinja
    mode: "0755"
  when: node_exporter_baremetal
  loop: "{{ node_exporter_scraper_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  vars:
    path: /etc/node_exporter/wrappers
    scraper_path: "{{ item.path }}"
  notify:
    - Reload systemd
- name: Create scraper services
  ansible.builtin.template:
    dest: "{{ path }}.{{ item.path | basename }}.service"
    src: scraper-service.jinja
    mode: "0644"
  when: node_exporter_baremetal
  loop: "{{ node_exporter_scraper_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  vars:
    path: /lib/systemd/system/node-exporter-scraper
    scraper_name: "{{ item.path | basename }}"
    wrapper_path: "/etc/node_exporter/wrappers/{{ item.path | basename }}"
  notify:
    - Reload systemd
- name: Flush scraper handlers before starting scrapers
  ansible.builtin.meta: flush_handlers
  when: node_exporter_baremetal
- name: Start scrapers
  ansible.builtin.service:
    name: "node-exporter-scraper.{{ item.path | basename }}.service"
    state: started
    enabled: true
  when: node_exporter_baremetal
  loop: "{{ node_exporter_scraper_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
- name: Install node-exporter
  ansible.builtin.import_role:
    name: prometheus.prometheus.node_exporter
  vars:
    node_exporter_version: "1.8.1"
    node_exporter_web_listen_address: "{{ node_exporter_ip }}:9100"
    node_exporter_enabled_collectors:
      - processes
      - interrupts
      - tcpstat
      - textfile:
          directory: /var/lib/node_exporter
