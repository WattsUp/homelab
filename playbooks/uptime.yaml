---
- name: Setup uptime monitor
  hosts: docker0.nibbler
  roles:
    - role: uptime
      become: true
      uptime_password: "{{ uptime_admin_password }}"
      uptime_network: "{{ 'vlan-' + vlan_management.name }}"
      uptime_ipv4_address: "{{ ip_uptime }}"
      uptime_extra_networks:
        - name: "{{ docker_uptime_network }}"
      uptime_api_host_ip: ""
      uptime_api_network: "{{ docker_uptime_network }}"
      uptime_api_delegate: "{{ inventory_hostname }}"
      uptime_dns_servers:
        - "{{ ip_dns_0 }}"
      uptime_discord_webhook: "{{ uptime_discord }}"
      uptime_etc_hosts:
        # NOTE: Most GUI names resolve through aliases on the shared Uptime
        # bridge. Nibbler and pfSense remain direct monitors outside Docker.
        nibbler.lan.bradleydavis.tech: "{{ hostvars['nibbler'].ip_management }}"
        pfsense.lan.bradleydavis.tech: "{{ hostvars['pfsense.nibbler'].ip_management }}"
      uptime_monitors_http:
        - name: DNS Primary GUI
          url: "https://dns0.{{ domain_lan }}"
        - name: DNS Secondary GUI
          url: "https://dns1.{{ domain_lan }}"
        - name: morbo GUI
          url: "https://morbo.{{ domain_lan }}"
          no_ssl: true
        - name: linda GUI
          url: "https://linda.{{ domain_lan }}"
          no_ssl: true
        - name: nibbler GUI
          url: "https://nibbler.{{ domain_lan }}"
        - name: pfsense.nibbler GUI
          url: "https://pfsense.{{ domain_lan }}"
        - name: prometheus GUI
          url: "https://prometheus.{{ domain_lan }}"
        - name: grafana GUI
          url: "https://grafana.{{ domain_lan }}"
        - name: nummus GUI
          url: "https://nummus.{{ domain_lan }}/status"
        - name: home assistant GUI
          url: "https://home.{{ domain_lan }}"
      uptime_monitors_ping:
        - name: morbo Ping
          ip: "{{ hostvars['morbo'].ip_management }}"
        - name: linda Ping
          ip: "{{ hostvars['linda'].ip_management }}"
        - name: nibbler Ping
          ip: "{{ hostvars['nibbler'].ip_management }}"
        - name: pfsense.nibbler Ping
          ip: "{{ hostvars['pfsense.nibbler'].ip_management }}"
        # Leela has 2s response time over HTTP, use ping only
        - name: leela Ping
          ip: "{{ hostvars['leela'].ip_management }}"
        # Sal has 2s response time over HTTP, use ping only
        - name: sal Ping
          ip: "{{ hostvars['sal'].ip_management }}"
        - name: docker0.nibbler Ping
          ip: "{{ hostvars['docker0.nibbler'].ip_management }}"
        - name: ntp Ping
          ip: "{{ ip_ntp }}"
        - name: reverse-proxy Ping
          ip: "{{ ip_reverse_proxy }}"
        - name: home assistant Ping
          ip: "{{ ip_home_assistant }}"
      uptime_monitors_dns: []
      uptime_monitors_port:
        - name: DNS Primary port
          ip: "{{ ip_dns_0 }}"
          port: 53
        - name: DNS Secondary port
          ip: "{{ ip_dns_1 }}"
          port: 53
        - name: nibbler node-exporter
          ip: "{{ hostvars['nibbler'].ip_management }}"
          port: 9100
        - name: docker0.nibbler cadvisor
          ip: "{{ hostvars['docker0.nibbler'].ip_management }}"
          port: 8080
